[package]
name = "ofe-sim"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
ofe-character-runtime = { path = "../../engine/character-runtime" }
ofe-resource-runtime = { path = "../../engine/resource-runtime" }
ofe-combat-core = { path = "../../engine/combat-core" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["raw_value"] }

[dev-dependencies]
criterion = { version = "=0.5.1", default-features = false }

[[bench]]
name = "duel"
harness = false

[[bench]]
name = "arena"
harness = false
